<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><title>نتيجة الدفع | أكاديمية سلام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"/><link rel="stylesheet" href="../css/portal.css"/>
<style>.portal-body{background:linear-gradient(160deg,#1B5E20,#2E7D32 50%,#0F3D13)}.btn-portal-primary{background:linear-gradient(135deg,#1B5E20,#2E7D32)}</style></head>
<body class="portal-body"><div class="portal-container"><div class="portal-card"><div class="portal-body-pad" style="text-align:center">
<div id="ico" style="font-size:4.5rem">⏳</div><h1 id="ttl" style="color:#1B5E20;font-size:1.6rem;margin:10px 0 6px">جاري التحقق من الدفع...</h1>
<p id="msg" style="color:#6B4530;line-height:1.8">لحظات من فضلك</p>
<div id="box" style="background:#F3F8F2;border-radius:14px;padding:14px;margin:18px 0;text-align:right;display:none"></div>
<a href="dashboard.html" class="btn-portal-primary" style="display:block;text-decoration:none;text-align:center">الذهاب إلى حسابي</a>
<a href="https://wa.me/96593000607" target="_blank" class="btn-portal-whatsapp" style="margin-top:10px">💬 تواصل معنا</a></div></div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="../js/firebase-config.js"></script>
<script>
const q = new URLSearchParams(location.search);
const oid = v => (String(v || '').match(/^[A-Za-z0-9]{20}/) || [''])[0]; // Firestore id; UPayment glues "?payment_id=…" onto ?order=
let order = oid(q.get('requested_order_id')) || oid(q.get('order')) || oid(q.get('reference')) || ''; const track = q.get('track_id') || q.get('trackId') || ''; const result = (q.get('result') || '').toUpperCase();
const set = (i, t, m) => { document.getElementById('ico').textContent = i; document.getElementById('ttl').textContent = t; document.getElementById('msg').innerHTML = m; };
const canceled = () => set('↩️', 'تم إلغاء الدفع', 'لم يتم خصم أي مبلغ. ارجع إلى حسابك للدفع.');
async function check() {
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 12000);
  try { const r = await fetch(PAYMENT_API_URL + '/verifyPayment?' + new URLSearchParams({ order, track_id: track }), { signal: ac.signal, cache: 'no-store' }); return await r.json(); }
  catch (_) { return null; } finally { clearTimeout(t); }
}
function show(p) {
  const box = document.getElementById('box'); box.style.display = 'block';
  box.innerHTML = (p.items || []).map(i => `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${i.icon || ''} ${i.name}${i.qty > 1 ? ' ×' + i.qty : ''}</span><b>${(i.price * i.qty).toFixed(3)} د.ك</b></div>`).join('') + `<div style="display:flex;justify-content:space-between;border-top:1px dashed #ccc;margin-top:8px;padding-top:8px"><b>الإجمالي</b><b style="color:#1B5E20">${(+p.amount).toFixed(3)} د.ك</b></div>`;
  if (p.status === 'paid') set('🎉', 'تم الدفع بنجاح!', `شكراً لك${p.childName ? ' — ' + p.childName : ''}. ${p.activated ? 'تم تفعيل الاشتراك تلقائياً ✅' : 'تم تسجيل الدفعة ✅'}`);
  else if (p.status === 'failed') set('❌', 'لم تتم عملية الدفع', 'لم يتم خصم أي مبلغ. يمكنك المحاولة مرة أخرى من حسابك.');
  else set('⏳', 'بانتظار تأكيد الدفع', 'إذا أتممت الدفع فسيتم التأكيد خلال لحظات...');
}
(async () => {
  if (!order && !track) return result === 'CANCELED' ? canceled() : set('ℹ️', 'لا يوجد طلب دفع', 'لم يتم خصم أي مبلغ. ارجع إلى حسابك للدفع.');
  for (let n = 0; n < 20; n++) { // ~1 minute
    const j = await check();
    if (j && j.orderId) order = j.orderId;
    if (j && j.ok === false && j.error === 'order not found') return set('❓', 'لم نجد الطلب', 'تواصل معنا إذا تم خصم المبلغ.');
    if (j && j.status) { show(j); if (j.status === 'paid' || j.status === 'failed') return; if (result === 'CANCELED') return canceled(); }
    await new Promise(r => setTimeout(r, 3000));
  }
  set('⏳', 'بانتظار تأكيد الدفع', 'إذا تم خصم المبلغ فسيظهر في حسابك خلال دقائق. يمكنك الذهاب إلى حسابك الآن.');
})();
</script></body></html>
