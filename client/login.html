<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1"/>
  <title>دخول الأعضاء | أكاديمية سلام</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/portal.css"/>
  <link rel="manifest" href="../manifest.json"/>
  <meta name="theme-color" content="#B8541E"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="apple-touch-icon" href="../images/icon-192.png"/>
</head>
<body class="portal-body">
  <div class="portal-container">
    <div class="portal-card">
      <div class="portal-top-bar">
        <img src="../images/logo-ar.png" alt="Salam Academy" class="portal-logo-img" style="filter:none;background:#fff;border-radius:50%;padding:6px"/>
        <h1>أكاديمية سلام</h1>
        <p>بوابة أولياء الأمور</p>
      </div>
      <div class="portal-body-pad">
        <p style="text-align:center;color:var(--text-mid);font-size:0.9rem;margin-bottom:18px;line-height:1.7">أدخل رقم هاتفك المسجّل في الأكاديمية لمتابعة اشتراك أبنائك</p>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <div class="phone-input-wrap">
            <span class="phone-prefix">🇰🇼 +965</span>
            <input type="tel" id="loginPhone" placeholder="XXXXXXXX" maxlength="8" inputmode="numeric" autocomplete="tel" autofocus/>
          </div>
        </div>
        <button class="btn-portal-primary" id="enterBtn" onclick="enter()">دخول ←</button>
        <div id="msgBox" class="error-msg"></div>
        <div class="divider"><span>ليس لديك اشتراك؟</span></div>
        <a href="register.html" class="btn-portal-ghost" style="display:block;text-align:center;text-decoration:none;margin-top:0">📝 نموذج التسجيل</a>
        <a href="https://wa.me/96593000607" target="_blank" class="btn-portal-whatsapp" style="margin-top:10px">💬 تواصل معنا على واتساب</a>
        <p class="portal-footer-note"><a href="../index.html">← العودة للموقع الرئيسي</a></p>
        <p style="text-align:center;font-size:.72rem;color:#9a9a9a;margin-top:14px">تصميم وتطوير <a href="https://www.instagram.com/eng.abdullah.ai" target="_blank" rel="noopener" style="color:#6b6b6b;font-weight:800;text-decoration:none">م. عبدالله · <bdi dir="ltr">@eng.abdullah.ai</bdi></a></p>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script>
    const qp = new URLSearchParams(location.search); const qPhone = (qp.get('phone') || '').replace(/\D/g, '').slice(-8);
    const unreg = (qp.get('unreg') || '').replace(/\D/g, '');
    if (unreg) showMsg('هذا الرقم (' + unreg + ') غير مسجّل في الأكاديمية. يرجى تعبئة نموذج التسجيل والموافقة على الشروط أولاً، ثم انتظار موافقة الإدارة.');
    if (/^[569]\d{7}$/.test(qPhone)) { localStorage.setItem('salamPhone', qPhone); location.replace('dashboard.html' + (qp.get('go') ? '#' + qp.get('go') : '')); }
    const saved = localStorage.getItem('salamPhone');
    if (saved && /^\d{8}$/.test(saved)) location.replace('dashboard.html' + (qp.get('go') ? '#' + qp.get('go') : ''));
    const inp = document.getElementById('loginPhone');
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '').slice(0, 8); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
    function showMsg(t) { const m = document.getElementById('msgBox'); m.textContent = t; m.style.display = 'block'; m.style.background = '#ffebee'; m.style.color = '#c62828'; }
    async function enter() {
      const p = inp.value.trim();
      if (!/^[569]\d{7}$/.test(p)) return showMsg('أدخل رقم هاتف كويتي صحيح (8 أرقام)');
      const btn = document.getElementById('enterBtn'); btn.disabled = true; btn.textContent = '⏳ جاري التحقق...';
      try {
        const doc = await db.collection('portal').doc(p).get();
        if (!doc.exists) { btn.disabled = false; btn.textContent = 'دخول ←'; return showMsg('هذا الرقم غير مسجّل في الأكاديمية. يرجى تعبئة نموذج التسجيل والموافقة على الشروط أولاً، ثم انتظار موافقة الإدارة.'); }
      } catch (e) { btn.disabled = false; btn.textContent = 'دخول ←'; return showMsg('تعذر التحقق من الرقم. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.'); }
      localStorage.setItem('salamPhone', p); location.href = 'dashboard.html';
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  </script>
</body>
</html>
