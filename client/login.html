<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1"/>
  <title>دخول الأعضاء | أكاديمية سلام</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/portal.css"/>
  <link rel="manifest" href="../manifest.json"/>
  <meta name="theme-color" content="#B8541E"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="apple-touch-icon" href="../images/icon-192.png"/>
</head>
<body class="portal-body">
  <div class="portal-container">
    <div class="portal-card">
      <div class="portal-top-bar">
        <img src="../images/logo-ar.png" alt="Salam Academy" class="portal-logo-img" style="filter:none;background:#fff;border-radius:50%;padding:6px"/>
        <h1>أكاديمية سلام</h1>
        <p>بوابة أولياء الأمور</p>
      </div>
      <div class="portal-body-pad">
        <p style="text-align:center;color:var(--text-mid);font-size:0.9rem;margin-bottom:18px;line-height:1.7">أدخل رقم هاتفك المسجّل في الأكاديمية لمتابعة اشتراك أطفالك</p>
        <div class="form-group">
          <label>رقم الهاتف</label>
          <div class="phone-input-wrap">
            <span class="phone-prefix">🇰🇼 +965</span>
            <input type="tel" id="loginPhone" placeholder="XXXXXXXX" maxlength="8" inputmode="numeric" autocomplete="tel" autofocus/>
          </div>
        </div>
        <button class="btn-portal-primary" onclick="enter()">دخول ←</button>
        <div id="msgBox" class="error-msg"></div>
        <div class="divider"><span>ليس لديك اشتراك؟</span></div>
        <a href="register.html" class="btn-portal-ghost" style="display:block;text-align:center;text-decoration:none;margin-top:0">📝 نموذج التسجيل</a>
        <a href="https://wa.me/96593000607" target="_blank" class="btn-portal-whatsapp" style="margin-top:10px">💬 تواصل معنا على واتساب</a>
        <p class="portal-footer-note"><a href="../index.html">← العودة للموقع الرئيسي</a></p>
      </div>
    </div>
  </div>
  <script>
    const qp = new URLSearchParams(location.search); const qPhone = (qp.get('phone') || '').replace(/\D/g, '').slice(-8);
    if (/^[569]\d{7}$/.test(qPhone)) { localStorage.setItem('salamPhone', qPhone); location.replace('dashboard.html' + (qp.get('go') ? '#' + qp.get('go') : '')); }
    const saved = localStorage.getItem('salamPhone');
    if (saved && /^\d{8}$/.test(saved)) location.replace('dashboard.html' + (qp.get('go') ? '#' + qp.get('go') : ''));
    const inp = document.getElementById('loginPhone');
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '').slice(0, 8); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
    function enter() {
      const p = inp.value.trim();
      if (!/^[569]\d{7}$/.test(p)) { const m = document.getElementById('msgBox'); m.textContent = 'أدخل رقم هاتف كويتي صحيح (8 أرقام)'; m.style.display = 'block'; m.style.background = '#ffebee'; m.style.color = '#c62828'; return; }
      localStorage.setItem('salamPhone', p); location.href = 'dashboard.html';
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
  </script>
</body>
</html>
